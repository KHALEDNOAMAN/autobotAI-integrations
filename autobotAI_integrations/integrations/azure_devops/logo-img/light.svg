<svg aria-hidden="true" data-slug-id="azure-devops" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="globe_clip">
      <circle cx="176" cy="176" r="56"/>
