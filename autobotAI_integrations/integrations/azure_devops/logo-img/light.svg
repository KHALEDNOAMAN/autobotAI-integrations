  <rect x="92" y="92" width="48" height="48" rx="7" fill="#287CEB"/>
  <rect x="148" y="92" width="48" height="48" rx="7" fill="#1C72E4"/>
  <!-- Row 3 -->
  <rect x="36" y="148" width="48" height="48" rx="7" fill="#146BE0"/>
  <rect x="92" y="148" width="48" height="48" rx="7" fill="#0E60D6"/>
  <rect x="148" y="148" width="48" height="48" rx="7" fill="#0854CA"/>

  <!-- Globe Ocean Base (Direct overlap without white border ring, exactly as shown) -->
